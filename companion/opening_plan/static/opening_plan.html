<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening plan · Edge Trader</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #0b0e13; --panel: #12171e; --panel2: #0f141a; --line: #212a35; --line-hi: #2e3a48;
    --text: #dde3ea; --muted: #7f8a97; --dim: #4f5966;
    --green: #3fb68b; --green-bg: rgba(63,182,139,.12); --red: #e5534b; --red-bg: rgba(229,83,75,.12);
    --amber: #d6a52b; --amber-bg: rgba(214,165,43,.12); --blue: #4c8dff; --blue-bg: rgba(76,141,255,.14);
    --sans: "Inter", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .mut { color: var(--muted); }
  .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px;
          font: 600 12px var(--sans); border: 1px solid var(--line-hi); white-space: nowrap; }
  .pill.ok { color: var(--green); border-color: rgba(63,182,139,.5); background: var(--green-bg); }
  .pill.warn { color: var(--amber); border-color: rgba(214,165,43,.5); background: var(--amber-bg); }
  .pill.bad { color: var(--red); border-color: rgba(229,83,75,.55); background: var(--red-bg); }
  .pill.info { color: var(--blue); border-color: rgba(76,141,255,.5); background: var(--blue-bg); }
  .sp { flex: 1; }
  .clock { font: 600 13px var(--mono); }
  .bar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 10px 16px;
         border-bottom: 1px solid var(--line); background: var(--panel2); }
  .fld { display: flex; align-items: center; gap: 8px; }
  .in { height: 30px; width: 110px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-hi);
        background: var(--bg); color: var(--text); font: 600 14px var(--mono); }
  .btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-hi);
         background: var(--panel); color: var(--text); font: 600 13px var(--sans); cursor: pointer; }
  .btn:hover { border-color: var(--blue); }
  .msg { font-size: 12.5px; }
  .banner { margin: 10px 16px 0; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
  .banner.bad { background: var(--red-bg); color: #f3b1ac; border: 1px solid rgba(229,83,75,.4); }
  .banner.warn { background: var(--amber-bg); color: #ecd28c; border: 1px solid rgba(214,165,43,.4); }
  .banner.info { background: var(--blue-bg); color: #b8cffc; border: 1px solid rgba(76,141,255,.35); }
  .wrap { padding: 12px 16px 24px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 1100px; }
  th { text-align: left; color: var(--muted); font: 500 11px var(--sans); text-transform: uppercase;
       letter-spacing: .03em; padding: 6px 10px; border-bottom: 1px solid var(--line-hi); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n { font: 600 14px var(--mono); white-space: nowrap; }
  td .sub { display: block; font: 400 11.5px var(--sans); color: var(--muted); margin-top: 3px; white-space: normal; }
  .tk { font: 700 15px var(--mono); }
  .long { color: var(--green); } .short { color: var(--red); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 9px; font: 600 11px var(--sans); }
  .tag.final { background: var(--green-bg); color: var(--green); }
  .tag.sofar { background: var(--amber-bg); color: var(--amber); }
  .tag.none { background: rgba(127,138,151,.15); color: var(--muted); }
  .tag.bad { background: var(--red-bg); color: var(--red); }
  .warnline, .badline, .mutline { font: 400 12px var(--sans); white-space: normal; }
  .warnline { color: var(--amber); } .badline { color: var(--red); } .mutline { color: var(--muted); }
  .warnline + div, .badline + div, .mutline + div { margin-top: 3px; }
  tr.has-notes td { border-bottom: none; }
  tr.notes td { padding-top: 0; }
  td.data { min-width: 150px; white-space: nowrap; }
  .tag { white-space: nowrap; }
  table.stale td { opacity: .45; background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(229,83,75,.06) 8px 16px); }
  .ob { height: 26px; padding: 0 9px; margin: 0 4px 4px 0; border-radius: 6px; border: 1px solid var(--line-hi);
        background: var(--panel); color: var(--text); font: 600 12px var(--sans); cursor: pointer; white-space: nowrap; }
  .ob.long { border-color: rgba(63,182,139,.6); color: var(--green); }
  .ob.short { border-color: rgba(229,83,75,.6); color: var(--red); }
  .ob:disabled { opacity: .35; cursor: not-allowed; }
  td.orders { min-width: 220px; }
  tr.red td { background: var(--red-bg); }
  .foot { padding: 0 16px 20px; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .empty { padding: 26px 16px; color: var(--muted); }
  /* The armed plan's panel (companion/plan_auto, Step 6): only when GET /api/opening-plan/auto answers. */
  .auto { margin: 10px 16px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line-hi); background: var(--panel); }
  .auto.armed { border-color: rgba(229,83,75,.7); box-shadow: 0 0 0 1px rgba(229,83,75,.25) inset; }
  .auto .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .auto h2 { font-size: 14px; margin: 0; }
  .auto .lines { margin-top: 8px; display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 12.5px; }
  .auto .lines .tk { font-size: 13px; }
  .btn.arm { border-color: rgba(229,83,75,.7); color: var(--red); }
  .btn.disarm { border-color: rgba(214,165,43,.7); color: var(--amber); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .ovl { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding-top: 6vh; z-index: 10; }
  .dlg { width: min(680px, 94vw); max-height: 86vh; overflow: auto; background: var(--panel); border: 1px solid var(--line-hi); border-radius: 10px; padding: 16px 18px; }
  .dlg h3 { margin: 0 0 8px; font-size: 16px; }
  .dlg ul { margin: 4px 0 10px; padding-left: 18px; } .dlg li { margin: 2px 0; font-size: 13px; }
  .dlg .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; margin-top: 10px; }
  .dlg table { min-width: 0; } .dlg td { padding: 3px 10px 3px 0; border: none; font-size: 13px; }
  .dlg .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
  .bp { font: 500 12.5px var(--sans); color: var(--muted); }
  .bp b { font: 600 13px var(--mono); color: var(--text); }
  table.preview td { background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(214,165,43,.05) 10px 20px); }
</style>
</head>
<body>
<header>
  <h1>Opening plan</h1>
  <span class="mut" id="pb"></span>
  <span class="pill info" id="mode" title="This screen shows numbers only. It has no order buttons and sends nothing to Schwab.">Display only · no orders</span>
  <span class="pill warn" id="demo" style="display:none">DEMO · invented picks</span>
  <span class="sp"></span>
  <span class="pill" id="src">connecting</span>
  <span class="clock" id="clock"></span>
</header>
<div class="bar">
  <div class="fld"><span class="mut">Risk per pick $</span>
    <input class="in" id="risk" inputmode="decimal" autocomplete="off" placeholder="not set">
    <button class="btn" id="risk-save" type="button">Save</button><span class="msg" id="risk-msg"></span></div>
  <span class="pill" id="calm">calm flag</span>
  <span class="mut msg" id="calm-txt"></span>
  <span class="bp" id="bp" title="Schwab's numbers from the account read Edge Trader already makes. On this screen only.">Buying power</span>
  <span class="sp"></span>
  <span class="mut msg" id="picks-txt"></span>
</div>
<div id="banners"></div>
<div id="auto"></div>
<div id="ovl"></div>
<div class="wrap" id="wrap"></div>
<div class="foot" id="foot"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const px = v => v == null ? "–" : Number(v).toFixed(2);
const sh = v => v == null ? "–" : Number(v).toLocaleString("en-US");
const ago = s => s == null ? "" : (s < 10 ? `${Number(s).toFixed(1)} s ago` : `${Math.round(s)} s ago`);
let lastOk = 0, lastView = null, refresh = 2000, busy = false, typing = false;
// Row buttons (companion/plan_entries.py): only when the server has them (EDGE_TRADER_PLAN_BUTTONS=1
// and EDGE_TRADER_BREAK_ENTRY=1); a 404 means no buttons.
let entries = null, entriesOff = false;
// The armed plan (companion/plan_auto, Step 6): only when the server has it (EDGE_TRADER_PLAN_AUTO=1); 404: no panel.
let auto = null, autoOff = false, autoMsg = null;
const clicking = {}, said = {};
const STALE_MS = 6000;   // the page's own check: no answer from Edge Trader for 6 s marks the view old

function shares(r) {
  const s = r.shares || {};
  const pair = p => p == null ? "–" : (p.long === p.short ? sh(p.long) : `L ${sh(p.long)} · S ${sh(p.short)}`);
  if (s.state === "SET_RISK") return `<span class="mut">set risk</span>`;
  if (s.state === "NO_LEVELS") return `<span class="mut">–</span>`;
  if (s.state === "CALM_UNKNOWN")
    return `full ${pair(s.full)}<span class="sub">half ${pair(s.half)} · calm not known</span>`;
  const tag = s.state === "CALM" ? `<span class="sub">half size: calm day</span>` : `<span class="sub">full size</span>`;
  return `${pair(s.used)}${tag}`;
}

function side(r, k, cls) {
  const s = r[k];
  if (!s) return `<td class="n mut">–</td>`;
  return `<td class="n"><span class="${cls}">${px(s.entry)}</span> <span class="mut">→</span> ${px(s.stop)}</td>`;
}

function dataCell(b) {
  const st = b.state;
  if (st === "FINAL") return `<span class="tag final">final bar</span>`;
  // Edge Scanner's early 09:30 bar from Alpaca's snapshot (its PR #45): whole, not confirmed yet.
  if (st === "SO_FAR" && b.unconfirmed) return `<span class="tag sofar">not confirmed</span><span class="sub">09:30 bar from the snapshot · ${ago(b.age_s)}</span>`;
  if (st === "SO_FAR") return `<span class="tag sofar">so far</span><span class="sub">to ${esc(b.as_of_et)} ET · ${ago(b.age_s)}</span>`;
  if (st === "WAITING") return `<span class="tag none">waiting</span>`;
  if (st === "BAD") return `<span class="tag bad">bad data</span>`;
  return `<span class="tag none">no data</span>`;
}

// Everything a row needs said in words goes on one full-width line under it, so the numbers
// keep their columns.
function notes(r) {
  const b = r.bar || {}, out = [];
  const e = entryOf(r.ticker);
  if (e) {
    const st = e.entry, m = said[r.ticker];
    if (m) out.push(`<div class="${m.ok ? "mutline" : "badline"}">${esc(m.text)}</div>`);
    if (st.origin === "auto" && st.state !== "NONE") out.push(`<div class="${st.red ? "badline" : "warnline"}">Sent by the armed plan.</div>`);
    // Ruling of 2026-11-13 16:17 UTC: a click takes the row for the day (only said when the armed plan is on).
    if (st.origin === "click" && auto) out.push(`<div class="mutline">Yours since your click. The armed plan leaves this row for today.</div>`);
    if (st.text && !(m && m.text === st.text)) out.push(`<div class="${st.red ? "badline" : "mutline"}">${esc(st.text)}</div>`);
    else if (!st.text && e.place.long && e.place.long === e.place.short && e.place.long !== b.text && !m)
      out.push(`<div class="mutline">Place: ${esc(e.place.long)}</div>`);
    // A red row's entry may still rest at Schwab: its status goes under the red text.
    if (st.order_text) out.push(`<div class="mutline">${esc(st.order_text)}</div>`);
  }
  if (b.state !== "FINAL" && b.state !== "SO_FAR" && b.text) out.push(`<div class="${b.state === "BAD" ? "badline" : "mutline"}">${esc(b.text)}</div>`);
  for (const k of ["long", "short"]) if (r[k] && r[k].capped) out.push(`<div class="badline">${k === "long" ? "Long" : "Short"} shares ${esc(r[k].capped)}.</div>`);
  if (r.under_min_stop) {
    const pct = r.long && r.long.stop_atr_pct != null ? `${r.long.stop_atr_pct}% of ATR` : "under the minimum";
    out.push(`<div class="warnline">Stop is ${esc(pct)}, under the research's 2% minimum. The research would use stop
      ${px(r.long && r.long.research_stop)} (long) and ${px(r.short && r.short.research_stop)} (short). Not applied here.</div>`);
  } else if (r.under_min_stop === null && r.long) {
    out.push(`<div class="warnline">No ATR from Edge Scanner: the 2% minimum stop can't be checked.</div>`);
  }
  const red = e && e.entry.red ? " red" : "";
  return out.length ? `<tr class="notes${red}"><td></td><td colspan="${entries ? 11 : 10}">${out.join("")}</td></tr>` : "";
}

function entryOf(ticker) {
  return entries && entries.rows ? entries.rows.find(x => x.ticker === ticker) : null;
}

function ordersCell(r) {
  const e = entryOf(r.ticker);
  if (!e) return `<td class="orders mut">–</td>`;
  const off = (why) => (why || clicking[r.ticker] || Date.now() - lastOk > STALE_MS) ? "disabled" : "";
  const tip = (why) => esc(why || "");
  const b = (cls, act, side, label, why) =>
    `<button class="ob ${cls}" data-act="${act}" data-t="${esc(r.ticker)}" data-side="${side}" ${off(why)} title="${tip(why)}">${label}</button>`;
  const fl = e.flip_to || "";
  return `<td class="orders">${b("long", "place", "long", "Place long break", e.place.long)}${b("short", "place", "short", "Place short break", e.place.short)}<br>
    ${b("", "cancel", "", "Cancel", e.cancel)}${b(fl, "flip", fl, fl ? `Flip to ${fl}` : "Flip", e.flip)}
    <span class="sub">${e.flips}/${entries.max_flips} flips · ${entries.break_max_shares} share, test stage${
      e.send && e.send.long ? `; plan size ${sh(e.send.long.plan_shares)}` : ""}</span></td>`;
}

async function act(btn) {
  const t = btn.dataset.t, a = btn.dataset.act, side = btn.dataset.side, e = entryOf(t);
  if (!e || clicking[t]) return;
  const num = side && e.send && e.send[side];
  const body = {ticker: t};
  if (a === "place") body.side = side;
  if (a === "place" || a === "flip") {
    if (!num) return;
    body.expected = {trigger: num.trigger, stop: num.stop, shares: num.shares};   // what this page showed
  }
  clicking[t] = true; said[t] = {ok: true, text: `${a === "place" ? `Placing the ${side} break` : a === "flip" ? `Flipping to ${side}` : "Cancelling"}…`};
  if (lastView) render(lastView, false);
  try {
    const r = await fetch(`/api/opening-plan/${a}`, {method: "POST", headers: {"Content-Type": "application/json", "X-Companion": "1"},
                                                     body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
    said[t] = {ok: !!j.ok, text: j.ok ? (a === "cancel" ? "Cancelled, nothing filled." : `Sent: order ${j.order_id ?? "?"} (${j.status}).`) : (j.error || "Refused.")};
  } catch (err) {
    said[t] = {ok: false, text: `No answer from Edge Trader (${err.message}). Check the Pending orders on the dashboard before clicking again.`};
  } finally {
    clicking[t] = false;
    tick();
  }
}
document.addEventListener("click", ev => { const btn = ev.target.closest("button.ob"); if (btn && !btn.disabled) act(btn); });

function row(r) {
  const b = r.bar || {};
  const so = b.state === "SO_FAR" ? `<span class="sub">${b.unconfirmed ? "not confirmed" : "so far"}</span>` : "";
  const near = r.nearer === "long" ? `<span class="long">long (high)</span>` : r.nearer === "short"
    ? `<span class="short">short (low)</span>` : r.nearer === "even" ? "even" : "–";
  const n = notes(r);
  const e = entryOf(r.ticker);
  return `<tr class="${n ? "has-notes" : ""}${e && e.entry.red ? " red" : ""}">
    <td class="n">${esc(r.rank)}</td>
    <td><span class="tk">${esc(r.ticker)}</span></td>
    <td class="n">${px(r.atr)}</td>
    <td class="n">${px(b.high)}${so}</td>
    <td class="n">${px(b.low)}${so}</td>
    <td class="data">${dataCell(b)}</td>
    ${side(r, "long", "long")}
    ${side(r, "short", "short")}
    <td class="n">${px(r.rps)}</td>
    <td class="n">${shares(r)}</td>
    <td>${near}${b.state === "SO_FAR" ? `<span class="sub">${b.unconfirmed ? "from the unconfirmed close" : "from the close so far"}</span>` : ""}</td>
    ${entries ? ordersCell(r) : ""}
  </tr>${n}`;
}

// The buying power line (brief 21): Schwab's own numbers with the time read, or "not known".
const usd = v => v == null ? "not known" : "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
function buyingPower(b) {
  if (!b || b.state === "NOT_KNOWN") return `Buying power <b>not known</b>`;
  if (b.state === "HIDDEN") return `Buying power <b>hidden</b>`;
  return `Buying power · day trading <b>${usd(b.day_trading)}</b> · buying power <b>${usd(b.buying_power)}</b>
    · equity <b>${usd(b.equity)}</b> · read ${esc(b.read_at_et)} ET, ${ago(b.age_s)}`;
}

// Edge Scanner's preview from 09:00 ET until the 09:25 freeze: names and pre-market levels only.
// No 09:30 minute, no levels, no shares and no buttons: every row says it is not locked.
function previewRow(r) {
  return `<tr>
    <td class="n">${esc(r.rank)}</td>
    <td><span class="tk">${esc(r.ticker)}</span></td>
    <td class="n">${px(r.atr)}</td>
    <td class="n">${px(r.pm_high)}</td>
    <td class="n">${px(r.pm_low)}</td>
    <td class="n">${px(r.last)}</td>
    <td><span class="tag sofar">Preview, not locked</span><span class="sub">Picks freeze at 09:25 ET.</span></td>
  </tr>`;
}

function render(v, browserStale) {
  $("pb").textContent = `${v.playbook.name} · ranks ${v.playbook.ranks[0]}-${v.playbook.ranks[1]} · ${v.playbook.bar} · flat ${v.playbook.flat_et} ET`;
  $("demo").style.display = v.demo ? "" : "none";
  const mode = $("mode");
  if (entries) {
    mode.className = "pill warn";
    mode.textContent = `Plan buttons ON · ${entries.break_max_shares} share test stage${entries.armed ? "" : " · ARM is off"}`;
    mode.title = "Each button sends one order to Schwab when you click it (EDGE_TRADER_PLAN_BUTTONS=1). Nothing is sent without a click.";
  }
  $("clock").textContent = `${v.now_et} ET`;
  const old = v.stale || browserStale;
  const src = $("src");
  if (v.source.ok_at_et == null) { src.className = "pill bad"; src.textContent = "no data from Edge Scanner"; }
  else if (old) { src.className = "pill bad"; src.textContent = `OLD DATA · Edge Scanner ${ago(v.source.age_s)}`; }
  else { src.className = "pill ok"; src.textContent = `Edge Scanner · ${ago(v.source.age_s)}`; }
  src.title = v.source.error ? `Last ask failed: ${v.source.error}` : `Last answer at ${v.source.ok_at_et || "–"} ET`;
  const c = v.calm || {};
  const calm = $("calm");
  if (c.calm === true) { calm.className = "pill bad"; calm.textContent = `SPY RV20 ${c.rv20.toFixed(2)} · calm · half size`; }
  else if (c.calm === false) { calm.className = "pill ok"; calm.textContent = `SPY RV20 ${c.rv20.toFixed(2)} · full size`; }
  else { calm.className = "pill warn"; calm.textContent = "calm flag not available"; }
  $("calm-txt").textContent = c.age_s != null && c.calm != null ? `RV20 read ${ago(c.age_s)}` : "";
  calm.title = c.text || "";
  if (!typing && document.activeElement !== $("risk"))
    $("risk").value = v.risk.per_pick == null ? "" : Number(v.risk.per_pick).toFixed(2);
  const p = v.picks, pv = v.state === "PREVIEW" ? v.preview : null;
  $("picks-txt").textContent = p ? `OV picks ${p.trading_date} · frozen ${p.frozen_at_et || "–"} ET${p.shadow ? " · shadow run" : ""}${p.late ? " · LATE" : ""}`
    : pv ? `OV preview ${pv.trading_date} · as of ${pv.as_of_et.slice(0, 5)} ET · not locked` : "";
  const bp = $("bp");
  bp.innerHTML = buyingPower(v.buying_power);
  bp.title = (v.buying_power && v.buying_power.text) || "Schwab's numbers from the account read Edge Trader already makes. On this screen only.";
  const banners = [];
  if (browserStale) banners.push(`<div class="banner bad">Edge Trader has not answered this page for ${Math.round((Date.now() - lastOk) / 1000)} s. Every number below is old.</div>`);
  if (pv) banners.push(`<div class="banner warn"><b>${esc(v.message)}</b> OV's ranked list as of ${esc(pv.as_of_et.slice(0, 5))} ET from Edge Scanner. It changes each minute; the plan's levels, shares and buttons wait for the frozen picks and the 09:30 minute.</div>`);
  else if (v.state !== "OK" && v.state !== "STALE" && v.message) banners.push(`<div class="banner ${v.state === "NO_ANSWER" || v.state === "NOT_SET_UP" ? "bad" : "info"}">${esc(v.message)}</div>`);
  for (const n of v.notes || []) banners.push(`<div class="banner ${n.startsWith("Old data") ? "bad" : "warn"}">${esc(n)}</div>`);
  if (c.calm == null && c.text && v.rows.length) banners.push(`<div class="banner warn">${esc(c.text)}</div>`);
  if (entries && entries.error) banners.push(`<div class="banner bad">${esc(entries.error)}</div>`);
  if (entries && entries.orders_old) banners.push(`<div class="banner bad">${esc(entries.orders_old)} Cancel still works.</div>`);
  if (auto && !auto.armed && auto.resting_text) banners.push(`<div class="banner bad">${esc(auto.resting_text)}</div>`);
  $("banners").innerHTML = banners.join("");
  renderAuto();
  if (pv) {
    $("wrap").innerHTML = !pv.rows.length ? `<div class="empty">No preview rows.</div>`
      : `<table class="preview${old ? " stale" : ""}"><thead><tr>
      <th>#</th><th>Ticker</th><th>ATR</th><th>PM high</th><th>PM low</th><th>Last</th><th>Status</th>
      </tr></thead><tbody>${pv.rows.map(previewRow).join("")}</tbody></table>`;
  } else if (!v.rows.length) { $("wrap").innerHTML = `<div class="empty">No plan rows.</div>`; }
  else {
    $("wrap").innerHTML = `<table class="${old ? "stale" : ""}"><thead><tr>
      <th>#</th><th>Ticker</th><th>ATR</th><th>09:30 high</th><th>09:30 low</th><th>Data</th>
      <th>Long: buy stop → stop</th><th>Short: sell stop → stop</th><th>Risk / share</th><th>Shares</th><th>Nearer side</th>
      ${entries ? "<th>Orders</th>" : ""}
      </tr></thead><tbody>${v.rows.map(row).join("")}</tbody></table>`;
  }
  $("foot").innerHTML = `Rule (research, opening_drive/engine.py): enter ${px(v.playbook.offset)} past the 09:30 ET minute's high or low; the stop is the other side.
    Shares = risk per pick ÷ risk per share, rounded down, inside the ticket's caps (10,000 shares, $250,000).
    Calm SPY day (RV20 ≤ ${v.playbook.calm_rv20_max}): ${v.playbook.calm_multiplier}× the risk. Nearer side: which break the minute's close sits closer to.
    ${entries ? `With the plan buttons on, each Place, Cancel or Flip button sends one request to Schwab when you click it, built from
    the server's own row (never this page's prices). Flip cancels first and places the other side only after Schwab confirms the cancel with nothing
    filled; otherwise the row turns red and nothing more is sent from it today. At most ${entries.max_flips} flips per row a day.`
    : "This screen places, changes and cancels nothing."}`;
}

async function tick() {
  if (busy) return;
  busy = true;
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 1800);
    const r = await fetch("/api/opening-plan", {cache: "no-store", signal: ctl.signal});
    clearTimeout(t);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    lastView = await r.json();
    await readEntries();
    await readAuto();
    lastOk = Date.now();
    refresh = Math.max(1000, (lastView.playbook.refresh_seconds || 2) * 1000);
    render(lastView, false);
  } catch (e) {
    if (lastView) render(lastView, Date.now() - lastOk > STALE_MS);
    else $("banners").innerHTML = `<div class="banner bad">Edge Trader is not answering (${esc(e.message)}). No data.</div>`;
  } finally {
    busy = false;
  }
}

async function readEntries() {
  if (entriesOff) return;
  try {
    const r = await fetch("/api/opening-plan/entries", {cache: "no-store"});
    if (r.status === 404) { entriesOff = true; entries = null; return; }   // break entries are off
    entries = r.ok ? await r.json() : null;
  } catch (e) {
    entries = null;      // no answer: no buttons, rather than buttons on old state
  }
}

async function readAuto() {
  if (autoOff) return;
  try {
    const r = await fetch("/api/opening-plan/auto", {cache: "no-store"});
    if (r.status === 404) { autoOff = true; auto = null; return; }   // the armed plan is off
    auto = r.ok ? await r.json() : null;
  } catch (e) {
    auto = null;
  }
}

function autoLine(p) {
  const d = p.decision || {}, a = p.action || {};
  const what = p.left ? `<span class="badline">${esc(p.left)}</span>`
    : a.event ? `${esc(a.event.replace("_", " "))}${a.status ? " " + esc(a.status) : ""}${a.at_et ? ` at ${esc(a.at_et)} ET` : ""}`
    : `<span class="mut">${esc(d.why || p.note || "–")}</span>`;
  return `<span class="tk">${esc(p.ticker)}</span><span>${d.kind && !p.left ? `<span class="mut">${esc(d.kind)}</span> · ` : ""}${what}</span>`;
}

function renderAuto() {
  const el = $("auto");
  if (!auto) { el.innerHTML = ""; return; }
  const a = auto, u = a.used || {}, b = a.bounds || {};
  const state = a.armed ? `<span class="pill bad">ARMED since ${esc(a.armed_at_et)} ET · ends ${esc(a.until_et)} ET</span>`
    : a.disarmed ? `<span class="pill warn">Disarmed at ${esc(a.disarmed.at_et)} ET</span>` : `<span class="pill">Not armed</span>`;
  const why = !a.armed && a.disarmed ? `<div class="${a.blocked_today ? "badline" : "mutline"}" style="margin-top:6px">Disarmed: ${esc(a.disarmed.why)}${a.blocked_today ? " No new Arm today." : ""}</div>` : "";
  const lines = (a.picks || []).map(autoLine).join("");
  el.className = `auto${a.armed ? " armed" : ""}`;
  el.innerHTML = `<div class="hd"><h2>Armed plan</h2>${state}
      <span class="mut msg">${esc(a.playbook)} · orders ${u.orders_day ?? 0}/${b.orders_per_day} today · Schwab calls ${u.calls_minute ?? 0}/${b.calls_per_minute} a minute (sends)</span>
      <span class="sp"></span>
      ${a.armed ? `<button class="btn disarm" id="auto-disarm" type="button">Disarm</button>` : `<button class="btn arm" id="auto-arm" type="button">Arm…</button>`}
    </div>${why}
    ${a.problem ? `<div class="badline" style="margin-top:6px">${esc(a.problem)}</div>` : ""}
    ${a.tape_note ? `<div class="mutline" style="margin-top:6px">${esc(a.tape_note)}</div>` : ""}
    ${a.row_check_text ? `<div class="warnline" id="auto-row-check" style="margin-top:6px">${esc(a.row_check_text)}</div>` : ""}
    ${autoMsg ? `<div class="${autoMsg.ok ? "mutline" : "badline"}" style="margin-top:6px">${esc(autoMsg.text)}</div>` : ""}
    ${lines ? `<div class="lines">${lines}</div>` : `<div class="mutline" style="margin-top:6px">${a.armed ? "Waiting for 09:31:00 ET and a final 09:30 bar on the open tape." : "Nothing armed. Arm works 09:25:00 to 09:30:45 ET; the plan then sends by itself, 1 share a pick."}</div>`}`;
  const arm = $("auto-arm"), dis = $("auto-disarm");
  if (arm) arm.onclick = openArm;
  if (dis) dis.onclick = disarm;
}

async function openArm() {
  let j;
  try {
    const r = await fetch("/api/opening-plan/auto?check=1", {cache: "no-store"});
    j = await r.json();
  } catch (e) { autoMsg = {ok: false, text: `No answer from Edge Trader (${e.message}).`}; renderAuto(); return; }
  const t = j.dialog || {}, b = t.bounds || {}, refused = j.refusals || [];
  const li = xs => (xs || []).map(x => `<li>${esc(x)}</li>`).join("");
  $("ovl").innerHTML = `<div class="ovl"><div class="dlg" role="dialog" aria-label="Arm the plan">
    <h3>Arm “${esc(t.playbook)}” for today?</h3>
    <div class="mutline">Picks: <b>${esc((t.picks || []).join(", ") || "none")}</b> · <b>${esc(t.shares)} share each</b> ·
      risk per pick ${t.risk == null ? "not set" : "$" + Number(t.risk).toFixed(2)} · calm flag ${t.calm == null ? "not known" : t.calm ? "calm (half size)" : "not calm (full size)"}</div>
    <div class="k">It will</div><ul>${li(t.will)}</ul>
    <div class="k">It will not</div><ul>${li(t.will_not)}</ul>
    <div class="k">Bounds (start numbers, not approved by Ash; playbook.json "armed")</div>
    <table><tr><td>Orders per pick</td><td class="n">${esc(b.orders_per_pick)}</td><td>Orders per day</td><td class="n">${esc(b.orders_per_day)}</td></tr>
      <tr><td>Schwab calls a minute (sends)</td><td class="n">${esc(b.calls_per_minute)}</td><td>Calls per send / cancel</td><td class="n">${esc(b.calls_per_send)} / ${esc(b.calls_per_cancel)}</td></tr>
      <tr><td>Acts from</td><td class="n">${esc(b.act_from_et)} ET</td><td>Watch ends</td><td class="n">${esc(b.watch_until_et)} ET</td></tr></table>
    ${refused.length ? `<div class="k" style="color:var(--red)">Arm is refused now</div><ul class="badline">${li(refused)}</ul>` : ""}
    <div class="row"><button class="btn" id="arm-no" type="button">Close</button>
      <button class="btn arm" id="arm-yes" type="button" ${refused.length ? "disabled" : ""}>Arm with these bounds</button></div>
  </div></div>`;
  $("arm-no").onclick = () => { $("ovl").innerHTML = ""; };
  $("arm-yes").onclick = async () => {
    try {
      const r = await fetch("/api/opening-plan/arm", {method: "POST", headers: {"Content-Type": "application/json", "X-Companion": "1"},
                                                       body: JSON.stringify({playbook: t.playbook, bounds: b})});
      const k = await r.json();
      autoMsg = {ok: !!k.ok, text: k.ok ? "Armed." : (k.error || k.detail || "Refused.")};
    } catch (e) { autoMsg = {ok: false, text: `No answer from Edge Trader (${e.message}). Check the panel before clicking again.`}; }
    $("ovl").innerHTML = "";
    tick();
  };
}

async function disarm() {
  try {
    const r = await fetch("/api/opening-plan/disarm", {method: "POST", headers: {"Content-Type": "application/json", "X-Companion": "1"}, body: "{}"});
    const k = await r.json();
    autoMsg = {ok: !!k.ok, text: k.ok ? "Disarmed. Entries already at Schwab stay; each row's Cancel works." : (k.error || "Refused.")};
  } catch (e) { autoMsg = {ok: false, text: `No answer from Edge Trader (${e.message}). Press Disarm again.`}; }
  tick();
}

async function saveRisk() {
  const msg = $("risk-msg");
  msg.textContent = "saving…"; msg.className = "msg mut";
  try {
    const r = await fetch("/api/opening-plan/risk", {method: "POST", headers: {"Content-Type": "application/json", "X-Companion": "1"},
                                                      body: JSON.stringify({risk: $("risk").value})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
    msg.textContent = j.risk == null ? "cleared" : "saved"; msg.className = "msg long";
    typing = false;
    tick();
  } catch (e) {
    msg.textContent = e.message; msg.className = "msg short";
  }
}
$("risk-save").onclick = saveRisk;
$("risk").addEventListener("input", () => { typing = true; $("risk-msg").textContent = "not saved"; $("risk-msg").className = "msg mut"; });
$("risk").addEventListener("keydown", e => { if (e.key === "Enter") saveRisk(); });
tick();
(function loop() { setTimeout(() => { tick(); loop(); }, refresh); })();
</script>
</body>
</html>
